<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="arcGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="3"/>

  <!-- Scripture Cross-Reference Arcs in Background -->
  <g opacity="0.85" filter="url(#shadow)">
    <!-- Arc 1 -->
    <path d="M 80 340 C 80 140, 432 140, 432 340" fill="none" stroke="url(#arcGlow)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="6 4"/>
    <!-- Arc 2 -->
    <path d="M 120 340 C 120 180, 392 180, 392 340" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Arc 3 -->
    <path d="M 160 340 C 160 220, 352 220, 352 340" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>
  </g>

  <!-- Open Golden Scriptures Book Motif -->
  <g transform="translate(116, 210) scale(1.15)" filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M 120 110 C 70 100, 20 105, 5 118 L 5 18 C 20 6, 70 0, 120 12 Z" 
          fill="url(#goldPlate)" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Left Page Lines -->
    <line x1="22" y1="36" x2="105" y2="30" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="22" y1="54" x2="105" y2="48" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="22" y1="72" x2="105" y2="66" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="22" y1="90" x2="85" y2="85" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Page -->
    <path d="M 124 12 C 174 0, 224 6, 239 18 L 239 118 C 224 105, 174 100, 124 110 Z" 
          fill="url(#goldPlate)" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Right Page Lines -->
    <line x1="139" y1="30" x2="222" y2="36" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="139" y1="48" x2="222" y2="54" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="139" y1="66" x2="222" y2="72" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="139" y1="85" x2="202" y2="90" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Spine / Center Ridge -->
    <path d="M 120 12 L 124 12 L 124 110 L 120 110 Z" fill="#78350f"/>
  </g>

  <!-- Canonical Node Dots -->
  <circle cx="80" cy="340" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="120" cy="340" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="160" cy="340" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="352" cy="340" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="392" cy="340" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="432" cy="340" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>

  <!-- Golden Ray Sparkle at Top -->
  <polygon points="256,70 262,90 282,96 262,102 256,122 250,102 230,96 250,90" fill="#fef08a"/>
</svg>